
# click to focus a pane, drag borders to resize, scroll to scroll
set -g mouse on
# prefix + e: manually re-even the grid to a clean 2x2
bind e select-layout tiled
# auto re-even the grid to a clean 2x2 on every terminal resize
set-hook -g client-resized "select-layout tiled"

# Pass the inner program's OSC title through instead of tmux's own label.
# Without this, a herdr pane running `therdr` shows the literal title "therdr"
# and herdr's agent-detection rules (which match Claude's OSC title, e.g. the
# braille spinner prefix) have nothing to read. With it, herdr at least shows
# the real task title for tmux-wrapped sessions.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
